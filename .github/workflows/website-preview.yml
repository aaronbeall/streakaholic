# Deploys every pull request that changes website/ to
#   https://streakaholic.app/pr-preview/pr-<number>/
# and comments the link on the PR. Updates on each push; removed when the PR closes.
# Uses the same gh-pages branch as website.yml, so there's no extra setup.
name: Website preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'website/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: website-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: website
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
